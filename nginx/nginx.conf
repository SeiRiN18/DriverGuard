events {
    worker_connections 4096;
}

http {
    # Docker's internal DNS resolver — required for dynamic scaling
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream driverguard_api {
        # Round-robin (default). Docker DNS returns all replica IPs for "api".
        server api:8080;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # Increase timeouts for load-test bursts
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        location / {
            proxy_pass         http://driverguard_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Nginx status page for monitoring
        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            deny  all;
        }
    }
}
